<h1>{{ title }}</h1>

<table border="1">
  <thead>
  <tr>
    <th>Application No</th>
    <th>Applicant ID</th>
    <th>Permit ID</th>
    <th>Status ID</th>
    <th>Created Date</th>
  </tr>
  </thead>

  <tbody>
  <tr *ngFor="let app of applications">
    <td>{{ app.applicationNo }}</td>
    <td>{{ app.applicantId }}</td>
    <td>{{ app.permitId }}</td>
    <td>{{ app.statusId }}</td>
    <td>{{ app.createdDate }}</td>
  </tr>
  </tbody>
</table>
